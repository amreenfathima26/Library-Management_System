{% extends 'base.html' %}

{% block title %}Login - SmartLib{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-5">
            <h2 class="text-center mb-4 fw-bold text-primary">Login</h2>
            <form method="post">
                {% csrf_token %}
                {% if form.errors %}
                <div class="alert alert-danger">
                    Your username and password didn't match. Please try again.
                </div>
                {% endif %}

                <div class="mb-3">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required id="id_username">
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required id="id_password">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Login</button>
                </div>
                <input type="hidden" name="next" value="{{ next }}" />
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'signup' %}" class="text-decoration-none">Don't have an account? Sign up</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
