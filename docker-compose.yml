version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: college-erp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: college_erp
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: erp_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - erp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college-erp-backend
    environment:
      DB_USERNAME: erp_user
      DB_PASSWORD: erp_password
      DB_HOST: mysql
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-minimum-32-characters
      RAZORPAY_KEY_ID: your-razorpay-key-id
      RAZORPAY_KEY_SECRET: your-razorpay-key-secret
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - erp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college-erp-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - erp-network

volumes:
  mysql_data:

networks:
  erp-network:
    driver: bridge

